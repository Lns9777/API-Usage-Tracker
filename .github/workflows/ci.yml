name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest build twine
      - name: Lint
        run: ruff check backend sdk tests
      - name: Tests
        run: pytest -q
      - name: Build frontend assets
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          python scripts/package_frontend_assets.py
      - name: Verify frontend assets
        run: python scripts/verify_frontend_assets.py
      - name: Build
        run: python -m build
      - name: Package validation
        run: twine check dist/*

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Package validation
        run: npm run build
